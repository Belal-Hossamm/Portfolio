              </div>
            </div>
          </section>

          {/* Interactive Skills */}
          <section id="skills" className="py-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center max-w-3xl mx-auto mb-10">
              <span className="text-xs font-bold uppercase tracking-wider text-teal-500">Skillset</span>
              <h2 className="text-3xl font-extrabold mt-1">Interactive Skills Grid & Proficiencies</h2>
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">
              <div className="flex flex-wrap gap-2">
                {['All', 'Frontend', 'Programming Languages', 'Concepts & Tools', 'Leadership & Soft Skills'].map(c => (
                  <button
                    key={c}
                    onClick={() => setActiveSkillCat(c)}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                      activeSkillCat === c ? 'bg-teal-500 text-white' : 'glass-panel text-slate-400 hover:text-white'
                    }`}
                  >
                    {c}
                  </button>
                ))}
              </div>

              <input
                type="text"
                placeholder="Search skills..."
                value={skillSearch}
                onChange={e => setSkillSearch(e.target.value)}
                className="px-4 py-1.5 rounded-xl text-xs glass-panel focus:outline-none focus:ring-2 focus:ring-teal-500 w-full sm:w-60"
              />
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {filteredSkills.map(s => (
                <div key={s.name} className="glass-panel p-5 rounded-2xl flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/20">{s.tag}</span>
                      <span className="text-xs font-mono text-slate-400">{s.level}%</span>
                    </div>
                    <h3 className="font-bold text-sm text-slate-900 dark:text-white">{s.name}</h3>
                    <p className="text-[11px] text-slate-400">{s.category}</p>
                  </div>
                  <div className="w-full h-1.5 bg-slate-800 rounded-full mt-4 overflow-hidden">
                    <div className="h-full bg-teal-500 rounded-full" style={{ width: `${s.level}%` }}></div>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Experience Timeline */}
          <section id="experience" className="py-20 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center max-w-3xl mx-auto mb-12">
              <span className="text-xs font-bold uppercase tracking-wider text-teal-500">Career Timeline</span>
              <h2 className="text-3xl font-extrabold mt-1">Experience & Leadership Journey</h2>
            </div>

            <div className="space-y-8 relative border-l-2 border-teal-500/40 ml-4 sm:ml-8 pl-6 sm:pl-8">
              {experienceData.map((exp) => (
                <div key={exp.id} className="relative glass-panel p-6 rounded-2xl">
                  <div className="absolute -left-[35px] sm:-left-[43px] top-6 w-4 h-4 rounded-full bg-teal-500 ring-4 ring-[#080c14]"></div>
                  <div className="flex flex-wrap justify-between items-center gap-2 mb-2">
                    <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-teal-500/10 text-teal-400">{exp.badge}</span>
                    <span className="text-xs font-semibold text-slate-400">{exp.period}</span>
                  </div>
                  <h3 className="text-lg font-bold text-slate-900 dark:text-white">{exp.role} — <span className="text-teal-400">{exp.organization}</span></h3>
                  <p className="text-xs text-slate-600 dark:text-slate-300 mt-2">{exp.description}</p>
                  <ul className="list-disc list-inside space-y-1 mt-3 text-xs text-slate-600 dark:text-slate-400">
                    {exp.achievements.map((a, idx) => (
                      <li key={idx}>{a}</li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          </section>

          {/* Projects */}
          <section id="projects" className="py-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center max-w-3xl mx-auto mb-10">
              <span className="text-xs font-bold uppercase tracking-wider text-teal-500">Portfolio</span>
              <h2 className="text-3xl font-extrabold mt-1">Interactive Project Showcase</h2>
            </div>

            <div className="flex justify-center gap-2 mb-8">
              {['All', 'Web Development', 'Simulation & Algorithms'].map(c => (
                <button
                  key={c}
                  onClick={() => setActiveProjectCat(c)}
                  className={`px-4 py-2 rounded-xl text-xs font-semibold ${
                    activeProjectCat === c ? 'bg-teal-500 text-white' : 'glass-panel text-slate-400 hover:text-white'
                  }`}
                >
                  {c}
                </button>
              ))}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {filteredProjects.map((p) => (
                <div key={p.id} className="glass-panel rounded-2xl overflow-hidden flex flex-col justify-between">
                  <div className="h-36 p-5 flex flex-col justify-between" style={{ background: p.imageBg }}>
                    <span className="text-[11px] font-bold uppercase tracking-wider bg-black/40 text-white px-2 py-0.5 rounded-full w-max">
                      {p.category}
                    </span>
                    <h3 className="text-lg font-bold text-white drop-shadow">{p.title}</h3>
                  </div>
                  <div className="p-5 space-y-3">
                    <p className="text-xs text-slate-600 dark:text-slate-300">{p.summary}</p>
                    <div className="flex flex-wrap gap-1.5">
                      {p.tags.map(t => (
                        <span key={t} className="text-[10px] font-semibold px-2 py-0.5 rounded bg-teal-500/10 text-teal-400 border border-teal-500/20">{t}</span>
                      ))}
                    </div>
                  </div>
                  <div className="p-5 pt-0">
                    <a href={p.github} target="_blank" className="w-full block text-center py-2 rounded-xl bg-slate-800 hover:bg-teal-500 text-white text-xs font-bold transition-colors">
                      View on GitHub ↗
                    </a>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Certifications */}
          <section id="certifications" className="py-20 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center max-w-3xl mx-auto mb-10">
              <span className="text-xs font-bold uppercase tracking-wider text-teal-500">Credentials</span>
              <h2 className="text-3xl font-extrabold mt-1">Certifications & Honors</h2>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {certificationsData.map(c => (
                <div key={c.id} className="glass-panel p-6 rounded-2xl space-y-3">
                  <div className="flex justify-between items-start">
                    <div>
                      <span className="text-xs font-bold text-teal-400 uppercase">{c.issuer}</span>
                      <h3 className="text-base font-bold text-slate-900 dark:text-white">{c.title}</h3>
                    </div>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Verified</span>
                  </div>
                  <p className="text-xs text-slate-600 dark:text-slate-300">{c.description}</p>
                  <div className="flex flex-wrap gap-1.5 pt-2">
                    {c.skillsGained.map(sk => (
                      <span key={sk} className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300">{sk}</span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Contact */}
          <section id="contact" className="py-20 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center max-w-3xl mx-auto mb-10">
              <span className="text-xs font-bold uppercase tracking-wider text-teal-500">Contact</span>
              <h2 className="text-3xl font-extrabold mt-1">Get In Touch</h2>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div className="glass-panel p-6 sm:p-8 rounded-2xl space-y-6">
                <div>
                  <h3 className="text-lg font-bold">Contact Channels</h3>
                  <p className="text-xs text-slate-400 mt-1">Direct inquiries, internships, and collaborations.</p>
                </div>

                <div className="p-4 rounded-xl bg-slate-800/40 flex items-center justify-between">
                  <div>
                    <div className="text-[11px] text-slate-400">Direct Email</div>
                    <div className="text-sm font-bold text-teal-400">{personalInfo.email}</div>
                  </div>
                  <button onClick={handleCopy} className="px-3 py-1 text-xs rounded bg-teal-500 text-white font-semibold">
                    {copied ? "Copied!" : "Copy"}
                  </button>
                </div>

                <div className="space-y-2 text-xs">
                  <div><strong>Phone:</strong> {personalInfo.phone}</div>
                  <div><strong>Location:</strong> {personalInfo.location}</div>
                  <div><strong>LinkedIn:</strong> <a href={personalInfo.linkedin} target="_blank" className="text-teal-400 hover:underline">in/belal-hossam-239590409</a></div>
                  <div><strong>GitHub:</strong> <a href={personalInfo.github} target="_blank" className="text-teal-400 hover:underline">Belal-Hossamm</a></div>
                </div>
              </div>

              <div className="glass-panel p-6 sm:p-8 rounded-2xl">
                {formStatus ? (
                  <div className="text-center py-10 space-y-3">
                    <div className="text-3xl">🎉</div>
                    <h4 className="font-bold text-teal-400">Email Client Prepared!</h4>
                    <p className="text-xs text-slate-400">Message prefilled for {personalInfo.email}.</p>
                    <button onClick={() => setFormStatus(false)} className="text-xs text-teal-400 underline">Send another</button>
                  </div>
                ) : (
                  <form onSubmit={handleContactSubmit} className="space-y-3">
                    <input
                      type="text"
                      required
                      placeholder="Your Name"
                      value={formData.name}
                      onChange={e => setFormData({...formData, name: e.target.value})}
                      className="w-full px-3 py-2 rounded-xl text-xs glass-panel focus:outline-none focus:ring-2 focus:ring-teal-500"
                    />
                    <input
                      type="email"
                      required
                      placeholder="Your Email"
                      value={formData.email}
                      onChange={e => setFormData({...formData, email: e.target.value})}
                      className="w-full px-3 py-2 rounded-xl text-xs glass-panel focus:outline-none focus:ring-2 focus:ring-teal-500"
                    />
                    <input
                      type="text"
                      placeholder="Subject"
                      value={formData.subject}
                      onChange={e => setFormData({...formData, subject: e.target.value})}
                      className="w-full px-3 py-2 rounded-xl text-xs glass-panel focus:outline-none focus:ring-2 focus:ring-teal-500"
                    />
                    <textarea
                      rows="4"
                      required
                      placeholder="Message..."
                      value={formData.message}
                      onChange={e => setFormData({...formData, message: e.target.value})}
                      className="w-full px-3 py-2 rounded-xl text-xs glass-panel focus:outline-none focus:ring-2 focus:ring-teal-500"
                    ></textarea>
                    <button type="submit" className="w-full py-2.5 rounded-xl bg-teal-500 hover:bg-teal-600 text-white text-xs font-bold">
                      Send Message
                    </button>
                  </form>
                )}
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="py-8 border-t border-white/10 text-center text-xs text-slate-400">
            © {new Date().getFullYear()} Belal Hossam. Built with React & Tailwind CSS.
          </footer>

          {/* Resume Modal */}
          {resumeOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="glass-panel max-w-2xl w-full p-6 sm:p-8 rounded-2xl space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-bold text-lg">Belal Hossam — Resume</h3>
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} className="px-3 py-1 bg-teal-500 text-white rounded-lg text-xs font-bold">Print / PDF</button>
                    <button onClick={() => setResumeOpen(false)} className="px-2 py-1 text-slate-400 hover:text-white">✕</button>
                  </div>
                </div>
                <div className="text-xs space-y-3 text-slate-300">
                  <p><strong>Contact:</strong> {personalInfo.email} | {personalInfo.phone} | {personalInfo.location}</p>
                  <p><strong>LinkedIn:</strong> {personalInfo.linkedin}</p>
                  <p><strong>GitHub:</strong> {personalInfo.github}</p>
                  <hr className="border-white/10" />
                  <p><strong>Summary:</strong> {personalInfo.summary}</p>
                  <hr className="border-white/10" />
                  <p><strong>Education:</strong> {personalInfo.education.institution} — {personalInfo.education.degree} ({personalInfo.education.graduation})</p>
                  <hr className="border-white/10" />
                  <p><strong>Key Skills:</strong> JavaScript, React, HTML5, CSS3, Python, C++, AnyLogic Simulation, Git/GitHub, Team Leadership</p>
                  <hr className="border-white/10" />
                  <p><strong>Experience:</strong> Front-End Member @ Hult Prize SAMS (2025–Present), Vice Head of Social Media @ AIBE SAMS (2025–2026), PR Member @ AIBE SAMS (2025)</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
